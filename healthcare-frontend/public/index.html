<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0f1e" />
    <meta name="description" content="Healthcare ML Platform - AI powered Patient Readmission Prediction, Disease Outbreak Detection, and Hospital Resource Optimization" />
    <meta name="keywords" content="healthcare, machine learning, patient readmission, disease outbreak, hospital resources, AI, prediction" />
    <meta name="author" content="Healthcare ML Platform" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="Healthcare ML Platform" />
    <meta property="og:description" content="AI powered healthcare predictions and analytics" />
    <meta property="og:type" content="website" />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <title>Healthcare ML Platform</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #0a0f1e;
        color: #f9fafb;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #111827;
      }
      ::-webkit-scrollbar-thumb {
        background: #374151;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4b5563;
      }

      /* Text Selection */
      ::selection {
        background: #3b82f6;
        color: #ffffff;
      }

      /* Initial Loading Screen */
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0a0f1e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }

      #initial-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loader-icon {
        width: 60px;
        height: 60px;
        border: 3px solid #1f2937;
        border-top: 3px solid #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }

      .loader-title {
        font-size: 22px;
        font-weight: 700;
        color: #f9fafb;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
      }

      .loader-subtitle {
        font-size: 13px;
        color: #6b7280;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .loader-dots {
        display: flex;
        gap: 6px;
        margin-top: 24px;
      }

      .loader-dots span {
        width: 8px;
        height: 8px;
        background: #3b82f6;
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out;
      }

      .loader-dots span:nth-child(1) { animation-delay: -0.32s; }
      .loader-dots span:nth-child(2) { animation-delay: -0.16s; }
      .loader-dots span:nth-child(3) { animation-delay: 0s; }

      @keyframes spin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes bounce {
        0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
        40%            { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run Healthcare ML Platform.
    </noscript>

    <!-- Initial Loading Screen -->
    <div id="initial-loader">
      <div class="loader-icon"></div>
      <div class="loader-title">Healthcare ML Platform</div>
      <div class="loader-subtitle">Loading AI Models</div>
      <div class="loader-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <!-- React Root -->
    <div id="root"></div>

    <!-- Hide loader when React loads -->
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loader = document.getElementById('initial-loader');
          if (loader) {
            loader.classList.add('hidden');
            setTimeout(function() {
              loader.style.display = 'none';
            }, 500);
          }
        }, 800);
      });
    </script>
  </body>
</html>
